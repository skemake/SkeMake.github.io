# Sample workflow for building and deploying a Jekyll site to GitHub Pages
name: Deploy Jekyll with GitHub Pages dependencies preinstalled

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Fix permissions for generated site
        run: |
          sudo chown -R "$USER:$USER" _site
          chmod -R u+rwX _site

      - name: Install QR generator
        run: npm install -g qrcode

      - name: Generate one QR code per HTML page
        env:
          SITE_BASE_URL: https://pages.skemake.se/
        run: |
          find _site -type f -name '*.html' -print0 | while IFS= read -r -d '' html; do
            rel="${html#_site/}"
            echo "$html -> $rel"
            if [ "$rel" = "index.html" ]; then
              url="${SITE_BASE_URL}/"
              qr="_site/index.qr.svg"
            else
              url="${SITE_BASE_URL}/${rel}"
              qr="${html%.html}.qr.svg"
            fi

            echo "QR: $url -> $qr"
            qrcode -o "$qr" "$url" < /dev/null
          done

      - name: Insert QR image into each HTML page
        run: |
          find _site -type f -name '*.html' -print0 | while IFS= read -r -d '' html; do
            file="$(basename "$html")"
            base="${file%.html}"

            if [ "$file" = "index.html" ]; then
              qr="index.qr.svg"
            else
              qr="${base}.qr.svg"
            fi

            sed -i "s#</body>#<hr><p><img src=\"$qr\" alt=\"QR-kod för denna sida\" width=\"180\" height=\"180\"></p></body>#" "$html"
          done

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
